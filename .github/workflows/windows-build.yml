name: Windows build (Max/MSP)

# Verified with real CI runs - took a couple of rounds of fixes
# (VS-generator detection, static-CRT/MT mismatch against MaxAPI.lib).
# See README.md's "Windows" section for the full list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # First real run on the PD side (identical setup) failed with
      # "Generator Visual Studio 17 2022 could not find any instance of
      # Visual Studio" - CMake's own VS-instance auto-detection didn't
      # find it on the runner, even though VS2022 is installed there. Fix:
      # set up the MSVC dev environment explicitly (cl.exe/link.exe on
      # PATH via vcvarsall.bat) and build with Ninja instead, which needs
      # the compiler on PATH rather than relying on CMake to auto-discover
      # a VS install.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install bison/flex (winflexbison)
        run: choco install winflexbison3 -y

      - name: Build static Csound + libsndfile + libsamplerate
        shell: pwsh
        run: ./scripts/build_csound_static.ps1

      # -DCMAKE_MSVC_RUNTIME_LIBRARY forces static CRT (/MT), matching what
      # max-sdk-base's own max-pretarget.cmake would set automatically for
      # the Visual Studio generator - it only does that
      # `if (CMAKE_GENERATOR MATCHES "Visual Studio")`, which is false for
      # Ninja, so we set it ourselves here too (found via a real CI
      # failure: without it, this object's default dynamic CRT (/MD)
      # conflicts with the prebuilt MaxAPI.lib/MaxAudio.lib, which expect
      # /MT, causing dozens of unresolved CRT symbols at link time - see
      # scripts/build_csound_static.ps1's copy of this same comment).
      - name: Configure
        run: cmake -S . -B build/external -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"

      - name: Build
        run: cmake --build build/external

      - name: Verify external was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "externals/csound7~.mxe64")) {
            Write-Host "externals/csound7~.mxe64 not found - build failed silently"
            Get-ChildItem -Recurse build/external -Depth 2
            exit 1
          }

      # Bundle the external together with examples/ so the artifact is a
      # ready-to-use package (not just a bare binary). No help/ here on
      # purpose - not part of this package for now.
      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item externals/csound7~.mxe64 release-package/
          Copy-Item examples release-package/ -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: csound7-max-windows-x64
          path: release-package
